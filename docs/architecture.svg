<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">Jobs Wiki - Architecture cible</title>
  <desc id="desc">Diagramme d architecture cible avec sources, ingestion, ADLS, PostgreSQL, Databricks, API, Frontend et Power BI.</desc>
  <defs>
    <style>
      .title { font: 700 28px Segoe UI, Arial, sans-serif; fill: #1f2937; }
      .subtitle { font: 400 15px Segoe UI, Arial, sans-serif; fill: #4b5563; }
      .box-title { font: 700 16px Segoe UI, Arial, sans-serif; fill: #111827; }
      .box-text { font: 400 13px Segoe UI, Arial, sans-serif; fill: #1f2937; }
      .label { font: 600 12px Segoe UI, Arial, sans-serif; fill: #374151; }
      .edge { stroke: #374151; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
      .lane { fill: #f9fafb; stroke: #e5e7eb; stroke-dasharray: 6 6; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151" />
    </marker>
  </defs>

  <rect x="0" y="0" width="1400" height="900" fill="#ffffff" />
  <text x="60" y="60" class="title">Jobs Wiki - Architecture cible</text>
  <text x="60" y="88" class="subtitle">Pipeline end-to-end pour matching CV ↔ offres d emploi d organismes internationaux</text>

  <rect x="40" y="120" width="1320" height="220" rx="12" class="lane" />
  <text x="60" y="150" class="label">Couche data et ingestion</text>

  <rect x="40" y="360" width="1320" height="220" rx="12" class="lane" />
  <text x="60" y="390" class="label">Couche traitement et serving</text>

  <rect x="40" y="600" width="1320" height="240" rx="12" class="lane" />
  <text x="60" y="630" class="label">Couche experience utilisateur et reporting</text>

  <rect x="80" y="180" width="240" height="110" rx="14" fill="#dbeafe" stroke="#60a5fa" stroke-width="2" />
  <text x="100" y="212" class="box-title">Sources web</text>
  <text x="100" y="236" class="box-text">World Bank</text>
  <text x="100" y="256" class="box-text">AfDB</text>
  <text x="100" y="276" class="box-text">UN</text>

  <rect x="380" y="190" width="260" height="90" rx="14" fill="#fef3c7" stroke="#f59e0b" stroke-width="2" />
  <text x="400" y="222" class="box-title">Ingestion</text>
  <text x="400" y="246" class="box-text">GitHub Actions cron</text>
  <text x="400" y="266" class="box-text">ou Azure Function timer</text>

  <rect x="700" y="170" width="340" height="130" rx="14" fill="#dcfce7" stroke="#22c55e" stroke-width="2" />
  <text x="720" y="202" class="box-title">ADLS Gen2</text>
  <text x="720" y="226" class="box-text">Bronze / Silver / Gold</text>
  <text x="720" y="246" class="box-text">Parquet partitionne</text>
  <text x="720" y="266" class="box-text">par source et date</text>

  <rect x="580" y="430" width="280" height="110" rx="14" fill="#fee2e2" stroke="#ef4444" stroke-width="2" />
  <text x="600" y="462" class="box-title">PostgreSQL + pgvector</text>
  <text x="600" y="486" class="box-text">Offres actives</text>
  <text x="600" y="506" class="box-text">Embeddings</text>

  <rect x="920" y="410" width="320" height="150" rx="14" fill="#ede9fe" stroke="#8b5cf6" stroke-width="2" />
  <text x="940" y="442" class="box-title">Databricks + MLflow</text>
  <text x="940" y="466" class="box-text">Feature engineering</text>
  <text x="940" y="486" class="box-text">Labeling LLM</text>
  <text x="940" y="506" class="box-text">Entrainement</text>
  <text x="940" y="526" class="box-text">Registry et promotion modele</text>

  <rect x="620" y="680" width="250" height="110" rx="14" fill="#ffedd5" stroke="#fb923c" stroke-width="2" />
  <text x="640" y="712" class="box-title">API Matching</text>
  <text x="640" y="736" class="box-text">FastAPI + Docker</text>
  <text x="640" y="756" class="box-text">Azure Container Apps</text>

  <rect x="940" y="690" width="260" height="100" rx="14" fill="#e0f2fe" stroke="#38bdf8" stroke-width="2" />
  <text x="960" y="722" class="box-title">Frontend Streamlit</text>
  <text x="960" y="746" class="box-text">Upload CV + resultats</text>

  <rect x="300" y="690" width="230" height="100" rx="14" fill="#fef9c3" stroke="#eab308" stroke-width="2" />
  <text x="320" y="722" class="box-title">Power BI</text>
  <text x="320" y="746" class="box-text">Rapports marche</text>

  <path class="edge" d="M320 235 L380 235" />
  <text x="335" y="226" class="label">ingestion</text>

  <path class="edge" d="M640 235 L700 235" />
  <text x="652" y="226" class="label">raw vers bronze</text>

  <path class="edge" d="M760 300 L700 430" />
  <text x="700" y="372" class="label">silver vers OLTP</text>

  <path class="edge" d="M950 300 L1020 410" />
  <text x="980" y="366" class="label">gold pour ML</text>

  <path class="edge" d="M960 560 L860 680" />
  <text x="870" y="634" class="label">modele promu</text>

  <path class="edge" d="M940 740 L870 740" />
  <text x="880" y="730" class="label">requetes match</text>

  <path class="edge" d="M530 725 L580 500" />
  <text x="510" y="620" class="label">lecture Postgres</text>

  <path class="edge" d="M470 690 L740 300" />
  <text x="500" y="430" class="label">lecture ADLS Gold</text>
</svg>
